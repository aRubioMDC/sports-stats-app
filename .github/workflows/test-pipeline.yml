name: Test CI/CD

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

env:
  REGISTRY: ghcr.io
  CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend syntax check
        run: python -m compileall backend/app

      - name: Backend smoke tests (optional, requires CI_DATABASE_URL secret)
        if: env.CI_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: python -m pytest tests/test_smoke.py -q
        working-directory: backend

      - name: Backend smoke tests skipped
        if: env.CI_DATABASE_URL == ''
        run: echo "Skipping DB smoke tests because CI_DATABASE_URL is not configured."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  publish-test-images:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push test ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/hitrate-${{ matrix.image }}:test-latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/hitrate-${{ matrix.image }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
