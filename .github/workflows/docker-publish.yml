name: Build and publish Docker images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; github.repository_owner may not be.
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/hitrate-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/hitrate-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the self-hosted runner installed on the home PC (see DEPLOYMENT_GUIDE.md
  # section 31) — the runner polls GitHub outbound, so no inbound port is opened
  # for this to work.
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull latest images and restart containers
        run: ~/hitrate/infra/scripts/deploy.sh
