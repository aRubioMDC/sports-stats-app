# Front door of the stack. Only this container is reached by cloudflared, and
# cloudflared only connects over the internal docker network — nginx is never
# exposed to the host or the internet directly, so no TLS termination happens
# here (Cloudflare's edge already terminated HTTPS before the tunnel).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # API calls (frontend/src/api.ts uses a relative "/api" base) go to the backend.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Everything else is the SPA, served by the frontend container's own nginx.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
