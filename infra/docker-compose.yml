services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/hitrate-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    networks: [hitrate_net]

  backend:
    image: ghcr.io/${GHCR_OWNER}/hitrate-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [hitrate_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [hitrate_net]

  # Outbound-only connection to Cloudflare's edge — no host ports are published
  # anywhere in this file, so UFW can deny all inbound traffic except SSH.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    command: tunnel run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds:/etc/cloudflared/creds:ro
    depends_on:
      - nginx
    networks: [hitrate_net]

networks:
  hitrate_net:
    driver: bridge
